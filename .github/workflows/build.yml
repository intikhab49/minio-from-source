name: build

on:
  push:
    branches: [main]
    # docs, templates and the banner don't change the image; don't republish
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/assets/**'
      - '.github/dependabot.yml'
      - 'action.yml'
      - '.github/workflows/action-test.yml'
  pull_request:
  workflow_dispatch:

# One publish at a time per branch: overlapping pushes to main must not race
# each other to the same image tags. PR runs never publish, so they can cancel.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/minio-from-source
  MC_TAG: RELEASE.2025-08-13T08-35-41Z
  MC_COMMIT: 7394ce0dd2a80935aded936b09fa12cbb3cb8096

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest MinIO release. Gets :latest.
          - minio_tag: RELEASE.2025-10-15T17-29-55Z
            minio_commit: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
            latest: true
          - minio_tag: RELEASE.2025-09-07T16-13-09Z
            minio_commit: 07c3a429bfed433e49018cb0f78a52145d4bedeb
            latest: false
    steps:
      - uses: actions/checkout@v7

      # The Go build cross-compiles; QEMU only runs the small runtime stage
      # (apk add) for arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Build (amd64) for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: minio-from-source:smoke
          build-args: |
            MINIO_TAG=${{ matrix.minio_tag }}
            MINIO_COMMIT=${{ matrix.minio_commit }}
            MC_TAG=${{ env.MC_TAG }}
            MC_COMMIT=${{ env.MC_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.minio_tag }}
          cache-to: type=gha,scope=${{ matrix.minio_tag }},mode=max

      - name: Smoke test
        run: bash scripts/smoke-test.sh minio-from-source:smoke "${{ matrix.minio_tag }}"

      # Publish only from main of the public repository, never from PRs or forks.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.minio_tag }}
            ${{ matrix.latest && format('{0}:latest', env.IMAGE) || '' }}
          build-args: |
            MINIO_TAG=${{ matrix.minio_tag }}
            MINIO_COMMIT=${{ matrix.minio_commit }}
            MC_TAG=${{ env.MC_TAG }}
            MC_COMMIT=${{ env.MC_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.minio_tag }}

      - name: Attest build provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
